    /* ══════════════════════════════
       MOBILE OVERLAY
    ══════════════════════════════ */
    #mobile-overlay {
      display: none;
      position: fixed; inset: 0; z-index: 9999;
      background: radial-gradient(ellipse at 50% 80%, #1a1a14 0%, #0e0e0a 60%, #080806 100%);
      align-items: center; justify-content: center;
      font-family: 'Jost', sans-serif;
    }
    @media (max-width: 768px), (pointer: coarse) and (max-width: 1024px) {
      #mobile-overlay { display: flex; }
    }
    .mobile-content {
      text-align: center;
      animation: mobileFloat 3s ease-in-out infinite;
    }
    @keyframes mobileFloat {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-8px); }
    }
    .pixel-computer {
      display: inline-block;
      filter: drop-shadow(0 0 18px rgba(200,169,110,0.4));
      margin-bottom: 12px;
    }
    .screen { animation: screenGlow 2s ease-in-out infinite alternate; }
    @keyframes screenGlow {
      from { fill: #0f3460; }
      to   { fill: #162850; }
    }
    .cursor-px { animation: blinkPx 1s step-end infinite; }
    @keyframes blinkPx {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }
    .mobile-titulo {
      font-size: 1.8rem; font-weight: 300;
      color: #c8a96e; letter-spacing: 0.15em;
      margin: 0 0 12px 0;
      text-shadow: 0 0 20px rgba(200,169,110,0.5);
    }
    .mobile-texto {
      font-size: 0.85rem; font-weight: 300;
      color: rgba(200,169,110,0.6);
      letter-spacing: 0.2em; line-height: 2;
      margin: 0; text-transform: uppercase;
    }

    /* ══════════════════════════════
       INTRO OVERLAY
    ══════════════════════════════ */
    #intro-overlay {
      position: fixed; inset: 0; z-index: 999;
      background: radial-gradient(ellipse at 50% 80%, #1a1a14 0%, #0e0e0a 60%, #080806 100%);
      pointer-events: all;
      transition: opacity 1.2s ease;
      will-change: opacity;
    }
    #intro-overlay.hide {
      opacity: 0;
      pointer-events: none;
    }
    /* Body sin breathe mientras la intro está activa */
    body.intro-active {
      animation: none !important;
    }
    #intro-canvas {
      position: absolute; inset: 0;
      pointer-events: none;
      will-change: opacity;
    }
    #intro-base-light {
      position: absolute;
      bottom: -60px; left: 50%;
      transform: translateX(-50%);
      width: 340px; height: 180px;
      background: radial-gradient(ellipse at center bottom,
        rgba(200,169,110,0.13) 0%, rgba(200,169,110,0.05) 40%, transparent 70%);
      filter: blur(18px);
      pointer-events: none;
      opacity: 0; transition: opacity 2.5s ease;
      will-change: opacity;
    }
    #intro-base-light.show { opacity: 1; }
    #intro-hint {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0; transition: opacity 0.5s ease;
      will-change: opacity, transform;
    }
    #intro-hint.show { animation: introPulse 3s ease-in-out infinite; }
    #intro-hint.attention { animation: introAttention 0.6s ease 2; }
    @keyframes introPulse  { 0%,100%{opacity:0.7} 50%{opacity:1} }
    @keyframes introAttention {
      0%   { opacity:0.7; transform:translate(-50%,-50%) scale(1); }
      50%  { opacity:1;   transform:translate(-50%,-50%) scale(1.06); }
      100% { opacity:0.7; transform:translate(-50%,-50%) scale(1); }
    }
    #intro-btn {
      font-family: 'Jost', sans-serif; font-weight: 300;
      font-size: 12px; letter-spacing: 0.5em; text-transform: uppercase;
      color: #c8a96e; background: none; border: none; cursor: pointer;
      padding: 10px 6px; position: relative; white-space: nowrap;
      transition: transform 0.3s cubic-bezier(0.34,1.3,0.64,1),
                  color 0.3s ease, text-shadow 0.3s ease;
      text-shadow: 0 0 8px rgba(200,169,110,0.5), 0 0 20px rgba(200,169,110,0.2);
    }
    #intro-btn:hover, #intro-btn:active {
      transform: scale(1.08); color: #dfc085;
      text-shadow: 0 0 10px rgba(200,169,110,0.8), 0 0 28px rgba(200,169,110,0.45);
    }
    #intro-btn::after {
      content: ''; position: absolute; bottom: 0; left: 50%;
      width: 0; height: 1px;
      background: linear-gradient(90deg, transparent, #c8a96e, transparent);
      transform: translateX(-50%); transition: width 1.4s ease;
    }
    #intro-btn:hover::after, #intro-btn:active::after { width: 100%; }
    #intro-btn::before {
      content: ''; position: absolute; top: 50%; left: 50%;
      width: 0; height: 0; border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(200,169,110,0.18) 0%, transparent 70%);
      transform: translate(-50%, -50%);
      transition: width 0.6s ease, height 0.6s ease, opacity 0.6s ease;
      opacity: 0; pointer-events: none;
    }
    #intro-btn:hover::before, #intro-btn:active::before {
      width: 220px; height: 80px; opacity: 1;
    }
  </style>

  <!-- ══════════════════════════════
       PANTALLA FINAL — oculta hasta que celebracion.js la activa
  ══════════════════════════════ -->
  <div id="pantalla-final" style="
    display:none; position:fixed; inset:0; z-index:10000;
    background:#0E0E0E; align-items:center; justify-content:center;
    opacity:0; transition: opacity 1.2s ease;
    padding-bottom:12%;
  ">
    <div style="text-align:center; padding:2rem; max-width:700px;">
      <div id="final-texto" style="
        font-family:'Playfair Display',serif;
        font-size:clamp(1.3rem,2.8vw,1.55rem);
        font-style:italic; color:#c8a96e;
        line-height:2.1; min-height:10rem; white-space:pre-wrap;
      "><span id="final-cursor" style="
        display:inline-block; width:2px; height:1em;
        background:#c8a96e; margin-left:3px;
        vertical-align:middle; opacity:0;
      "></span></div>
      <div id="final-firma" style="
        margin-top:2.5rem;
        font-family:'Jost',sans-serif; font-weight:100;
        font-size:0.72rem; letter-spacing:0.45em;
        color:rgba(200,169,110,0.4); text-transform:uppercase;
        opacity:0; transition:opacity 2.5s ease;
      ">— Omar</div>
    </div>
  </div>

  <style>
    @keyframes finalBlink {
      0%,100% { opacity:1; }
      50%      { opacity:0; }
    }
    .final-cursor-activo {
      opacity:1 !important;
      animation: finalBlink 0.75s step-end infinite;
    }
  </style>

  <script>
    window.mostrarPantallaFinal = function() {
      const panel    = document.getElementById('pantalla-final');
      const textoEl  = document.getElementById('final-texto');
      const cursorEl = document.getElementById('final-cursor');
      const firmaEl  = document.getElementById('final-firma');

      const lineas = [
        "Gracias por ser una parte tan importante de mi vida,",
        "y por ser, sin duda,",
        "una de las mejores amigas que pude tener."
      ];

      // Mostrar panel
      panel.style.display = 'flex';
      cursorEl.classList.add('final-cursor-activo');
      requestAnimationFrame(() => requestAnimationFrame(() => {
        panel.style.opacity = '1';
      }));

      let textoActual = '';

      // Pool de audio precargado para evitar cortes
      const POOL_SIZE = 10;
      const audioPool = Array.from({ length: POOL_SIZE }, () => {
        const a = new Audio('assets/teclado.mp3');
        a.volume = 0.18;
        a.load();
        return a;
      });
      let poolIndex = 0;

      // Desbloquear contexto de audio silenciosamente
      const unlock = audioPool[0].cloneNode();
      unlock.volume = 0;
      unlock.play().catch(() => {});

      function playClick() {
        const a = audioPool[poolIndex % POOL_SIZE];
        poolIndex++;
        a.currentTime = 0;
        a.play().catch(() => {});
      }

      function escribir(texto, velocidad, onDone) {
        let i = 0;
        function tick() {
          if (i < texto.length) {
            textoActual += texto[i];
            textoEl.textContent = textoActual;
            textoEl.appendChild(cursorEl);
            if (texto[i] !== ' ' && texto[i] !== '\n') playClick();
            i++;
            const extra = texto[i - 1] === ' ' ? 60 : 0;
            setTimeout(tick, velocidad + Math.random() * 70 + extra);
          } else {
            if (onDone) onDone();
          }
        }
        tick();
      }

      function pausa(ms, fn) { setTimeout(fn, ms); }

      // Esperar que todo el pool esté listo antes de escribir
      Promise.all(
        audioPool.map(a => new Promise(res => {
          if (a.readyState >= 3) { res(); return; }
          a.addEventListener('canplaythrough', res, { once: true });
        }))
      ).then(() => {
        // Silencio inicial — 900ms
        pausa(900, () => {
          escribir(lineas[0], 95, () => {
            pausa(450, () => {
              textoActual += '\n';
              escribir(lineas[1], 95, () => {
                pausa(400, () => {
                  textoActual += '\n';
                  escribir(lineas[2], 95, () => {
                    pausa(1200, () => {
                      cursorEl.classList.remove('final-cursor-activo');
                      cursorEl.style.opacity = '0';
                      pausa(200, () => firmaEl.style.opacity = '1');
                    });
                  });
                });
              });
            });
          });
        });
      });
    };
  </script>

  <!-- ══════════════════════════════
       CORNERS DEL MARCO PRINCIPAL
  ══════════════════════════════ -->
  <script>
    function positionCorners() {
      try {
        const W = window.innerWidth, H = window.innerHeight, m = 30;
        document.getElementById('lineBottom').setAttribute('y1', H - m);
        document.getElementById('lineBottom').setAttribute('y2', H - m);
        document.getElementById('lineRight').setAttribute('x1', W - m);
        document.getElementById('lineRight').setAttribute('x2', W - m);
        document.getElementById('corner-tr').setAttribute('transform', `translate(${W-m},${m}) scale(-1,1)`);
        document.getElementById('corner-tr').innerHTML = '<use href="#orn"/>';
        document.getElementById('corner-bl').setAttribute('transform', `translate(${m},${H-m}) scale(1,-1)`);
        document.getElementById('corner-bl').innerHTML = '<use href="#orn"/>';
        document.getElementById('corner-br').setAttribute('transform', `translate(${W-m},${H-m}) scale(-1,-1)`);
        document.getElementById('corner-br').innerHTML = '<use href="#orn"/>';
      } catch(e) {}
    }
    positionCorners();
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(positionCorners, 100);
    });
  </script>
